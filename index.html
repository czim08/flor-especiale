<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Legendary Rose - Voxel Art</title>
    <style>
        /* --- Configuración y Paleta de Minecraft --- */
        :root {
            --bg-color: #1a1a1a; /* Fondo oscuro tipo Nether/Cueva */
            --mc-text-shadow: 2px 2px 0px #000;
            --bar-color: #ff3333; /* Rojo de carga */
            
            /* Tamaños */
            --block-size: 12px; /* Bloques más pequeños para mayor definición voxel */
            
            /* Paleta de Bloques - Degradados para profundidad por cara */
            /* Rojo - Capullo */
            --red-f: radial-gradient(#ff1a1a, #cc0000); /* Frontal */
            --red-t: #ff4d4d; /* Superior */
            --red-s: #990000; /* Lateral */
            
            /* Verde Vibrante - Tallo/Hojas */
            --green-f: radial-gradient(#2eb82e, #1f7a1f);
            --green-t: #5cd65c;
            --green-s: #145214;
        }

        /* --- Resets y Globales --- */
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }

        body {
            height: 100vh;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Courier New', monospace; /* Tipografía tipo MC */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* --- Pantalla de Carga (Estilo Crafteo) --- */
        #loader {
            position: absolute;
            text-align: center;
            z-index: 100;
            transition: opacity 0.5s ease;
            width: 100%;
        }

        #status {
            font-weight: 300;
            margin-bottom: 20px;
            font-size: 1.2rem;
            text-transform: uppercase;
            text-shadow: var(--mc-text-shadow);
        }

        .loading-bar-container {
            width: 250px;
            height: 12px;
            border: 2px solid white;
            margin: 0 auto;
            position: relative;
            background: rgba(0,0,0,0.5);
        }

        #bar {
            width: 0%;
            height: 100%;
            background-color: var(--bar-color);
            transition: width 0.1s linear;
        }

        /* --- Contenedor Principal (Escena) --- */
        .scene {
            width: 100vw;
            height: 100vh;
            perspective: 1200px; /* Profundidad 3D */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; /* Invisible hasta carga completa */
            transition: opacity 1s ease;
        }

        #pivot {
            position: relative;
            transform-style: preserve-3d;
            /* Inclinación base optimizada */
            transform: rotateX(-15deg) rotateY(45deg);
            will-change: transform; /* Optimización crítica de GPU */
        }

        /* --- Definición del Bloque (Cubo Voxel) --- */
        .block {
            position: absolute;
            width: var(--block-size);
            height: var(--block-size);
            transform-style: preserve-3d;
            /* Suavizado de aparición individual con efecto elástico */
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            will-change: transform;
        }

        /* Caras del Cubo */
        .face {
            position: absolute;
            width: var(--block-size);
            height: var(--block-size);
            border: 0.1px solid rgba(0,0,0,0.1); /* Micro-borde para definir bloque */
            image-rendering: pixelated; /* ¡Look pixelado! */
            backface-visibility: hidden; /* Optimización crítica de rendimiento */
        }

        /* Orientación de las caras */
        .front  { transform: translateZ(calc(var(--block-size) / 2)); }
        .back   { transform: rotateY(180deg) translateZ(calc(var(--block-size) / 2)); }
        .left   { transform: rotateY(-90deg) translateZ(calc(var(--block-size) / 2)); }
        .right  { transform: rotateY(90deg) translateZ(calc(var(--block-size) / 2)); }
        .top    { transform: rotateX(90deg) translateZ(calc(var(--block-size) / 2)); }
        .bottom { transform: rotateX(-90deg) translateZ(calc(var(--block-size) / 2)); }

        /* Estilos de Bloque - Aplicando degradados complejos */
        /* Bloque Rojo */
        .block-red .front, .block-red .back { background: var(--red-f); }
        .block-red .left,  .block-red .right { background: var(--red-s); }
        .block-red .top                      { background: var(--red-t); }
        .block-red .bottom                   { background: var(--red-s); opacity: 0.8; }

        /* Bloque Verde */
        .block-green .front, .block-green .back { background: var(--green-f); }
        .block-green .left,  .block-green .right { background: var(--green-s); }
        .block-green .top                        { background: var(--green-t); }
        .block-green .bottom                     { background: var(--green-s); opacity: 0.8; }


        /* --- Sombra en el suelo para realismo --- */
        .shadow-floor {
            position: absolute;
            width: 150px; height: 150px;
            background: radial-gradient(circle, rgba(0,0,0,0.6) 0%, transparent 70%);
            transform: rotateX(90deg) translateZ(-15px);
            margin-left: -75px;
            margin-top: -75px;
            pointer-events: none;
        }

        /* --- Texto Inferior (Original Mítico) --- */
        #instructions {
            position: absolute;
            bottom: 30px;
            text-align: center;
            width: 90%;
            max-width: 450px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border: 2px solid white;
        }

        #instructions h1 {
            color: #ffaa00; /* Color "Rare" o "Gold" */
            font-size: 1.1rem;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: var(--mc-text-shadow);
        }

        #instructions p {
            font-size: 0.9rem;
            color: #ddd;
        }

        /* Ajuste para pantallas muy pequeñas */
        @media (max-height: 500px) {
            #instructions { bottom: 10px; padding: 10px; }
            #instructions h1 { font-size: 1rem; }
        }

    </style>
</head>
<body>

    <div id="loader">
        <h2 id="status">Crafteando obra maestra...</h2>
        <div class="loading-bar-container"><div id="bar"></div></div>
    </div>

    <div class="scene" id="mainScene">
        <div id="pivot">
            <div class="shadow-floor"></div>
        </div>
    </div>

    <div id="instructions">
        <h1>[RARE ITEM]</h1>
        <p>ítem raro para una persona especial osea tu</p>
        <p style="font-size: 0.75rem; color: #aaa; margin-top: 5px;">(Arrastra para explorar)</p>
    </div>

    <script>
        // --- Elementos del DOM ---
        const dom = {
            loader: document.getElementById('loader'),
            bar: document.getElementById('bar'),
            scene: document.getElementById('mainScene'),
            pivot: document.getElementById('pivot'),
            instructions: document.getElementById('instructions')
        };

        // --- Generador de la Estructura de la Rosa (Voxel Data - COMPLEJA) ---
        // Definimos la rosa como una lista de coordenadas [x, y, z, tipo_bloque]
        // y = 0 es el suelo. x/z centrado en 0. y crece hacia arriba.
        function generateRoseStructure() {
            const data = [];

            // --- 1. TALLO CURVADO Y ORGÁNICO (y=0 a y=10) ---
            for (let y = 0; y <= 10; y++) {
                // Ecuación de curvatura suave
                let x = Math.sin(y * 0.3) * 1.5;
                let z = Math.cos(y * 0.2) * 1.0;
                
                // Grosor del tallo (2 bloques en la base, 1 arriba)
                data.push([Math.round(x), y, Math.round(z), 'block-green']);
                if (y < 4) data.push([Math.round(x) + 1, y, Math.round(z), 'block-green']);
            }

            // --- 2. HOJAS LATERALES DETALLADAS (y=2, y=5) ---
            // Hoja Inferior (y=2)
            for (let i = 1; i <= 3; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (Math.abs(j) < (3-i)/2 + 1) { // Forma triangular
                        data.push([i + 1, 2 + Math.floor(i/2), j, 'block-green']);
                    }
                }
            }
            
            // Hoja Superior (y=5)
            for (let i = 1; i <= 3; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (Math.abs(j) < (3-i)/2 + 1) {
                        data.push([-i - 1, 5 + Math.floor(i/2), j, 'block-green']);
                    }
                }
            }

            // --- 3. EL CAPULLO VOLUMINOSO (y=11 a y=16) ---
            const capulloBaseY = 11;

            // Capas del capullo (Nivel por Nivel)
            // Nivel 1 (y=11): Base (Denso y voluminoso)
            for (let x = -2; x <= 2; x++) {
                for (let z = -2; z <= 2; z++) {
                    // Evitar las esquinas perfectas para dar forma orgánica
                    if (Math.abs(x) < 2 || Math.abs(z) < 2) {
                        data.push([x, capulloBaseY, z, 'block-red']);
                    }
                }
            }

            // Nivel 2 (y=12): Cuerpo Central (Máximo Volumen)
            // Capa Interior
            for (let x = -1; x <= 1; x++) {
                for (let z = -1; z <= 1; z++) {
                    data.push([x, capulloBaseY + 1, z, 'block-red']);
                }
            }
            // Pétalos Exteriores (Abriéndose asimétricamente)
            const petalCoordsY12 = [
                [3, 0], [2, 1], [2, -1],   // Derecha
                [-3, 0], [-2, 1], [-2, -1], // Izquierda
                [0, 3], [1, 2], [-1, 2],   // Frontal
                [0, -3], [1, -2], [-1, -2]  // Trasero
            ];
            petalCoordsY12.forEach(p => data.push([p[0], capulloBaseY + 1, p[1], 'block-red']));

            // Nivel 3 (y=13): Capa Superior y Pétalos en Apertura
            // Capa Interior (Núcleo)
            for (let x = -1; x <= 1; x++) {
                for (let z = -1; z <= 1; z++) {
                    data.push([x, capulloBaseY + 2, z, 'block-red']);
                }
            }
            // Pétalos Exteriores (Desordenados y curvados)
            const petalCoordsY13 = [
                [2, 0], [-2, 0], [0, 2], [0, -2],
                [2, 2], [2, -2], [-2, 2], [-2, -2],
                [3, 1, 1], // Pétalo alto y asimétrico [x,y,z]
                [-3, -1, -1] // Pétalo bajo y asimétrico
            ];
            petalCoordsY13.forEach(p => {
                // Si la coordenada tiene 3 elementos, p[2] es un offset de Y
                let yOffset = p.length > 2 ? p[2] : 0;
                data.push([p[0], capulloBaseY + 2 + yOffset, p[1], 'block-red']);
            });

            // Nivel 4/5 (y=14/15): El Núcleo Pétalo por Pétalo
            data.push([0, capulloBaseY + 3, 0, 'block-red']);
            data.push([1, capulloBaseY + 3, 1, 'block-red']);
            data.push([-1, capulloBaseY + 3, -1, 'block-red']);
            
            // Pétalos más altos y centrales (Núcleo cerrado)
            data.push([0, capulloBaseY + 4, 0, 'block-red']);
            data.push([1, capulloBaseY + 4, 0, 'block-red']);
            data.push([0, capulloBaseY + 5, 0, 'block-red']); // El pico central

            return data;
        }

        const roseStructure = generateRoseStructure();

        // --- Generador Automático de Bloques Voxel ---
        // Retraso base para la animación de aparición
        const baseDelay = 800;
        
        function createBlock(x, y, z, blockClass, delay) {
            const block = document.createElement('div');
            block.className = `block ${blockClass}`;
            
            // Posicionamiento 3D inicial (escalado a 0 para aparición elástica)
            // Usamos unidades de bloque para x/y/z y lo convertimos a px
            block.style.transform = `translate3d(calc(${x} * var(--block-size)), calc(${-y} * var(--block-size)), calc(${z} * var(--block-size))) scale(0)`;
            
            // Crear las 6 caras
            const faces = ['front', 'back', 'left', 'right', 'top', 'bottom'];
            faces.forEach(faceName => {
                const face = document.createElement('div');
                face.className = `face ${faceName}`;
                block.appendChild(face);
            });

            // Añadir al pivot
            dom.pivot.appendChild(block);

            // Animación de aparición con retraso individual
            setTimeout(() => {
                block.style.transform = `translate3d(calc(${x} * var(--block-size)), calc(${-y} * var(--block-size)), calc(${z} * var(--block-size))) scale(1)`;
            }, baseDelay + delay);
        }

        // --- Configuración de Rotación Suavizada (Física) ---
        let targetRotY = 45;
        let targetRotX = -15;
        let currentRotY = 45;
        let currentRotX = -15;
        const sensitivity = 0.5; // Sensibilidad al arrastrar
        const smoothness = 0.15; // Factor de suavizado (0.01 a 1)

        // --- Simulación de Carga (5 segundos para la obra maestra) ---
        function simulateLoading() {
            let progress = 0;
            const startTime = Date.now();
            const duration = 5000; // 5 segundos

            const phrases = [
                "Generando chunks...",
                "Plantando voxels...",
                "Crafteando pétalos...",
                "Encantando objeto...",
                "Casi listo..."
            ];

            const interval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                progress = (elapsed / duration) * 100;

                if (progress >= 100) {
                    dom.bar.style.width = '100%';
                    dom.bar.innerText = "¡Crafteado!";
                    clearInterval(interval);
                    setTimeout(showScene, 600);
                } else {
                    dom.bar.style.width = progress + '%';
                }
            }, 50);
        }

        // --- Mostrar la Escena y Generar Rosa ---
        function showScene() {
            // Ocultar carga, mostrar escena
            dom.loader.style.opacity = '0';
            setTimeout(() => {
                dom.loader.remove();
                dom.scene.style.opacity = '1';
                dom.instructions.style.opacity = '1';

                // --- GENERAR LA ROSA MAESTRA DE BLOQUES ---
                // Iterar sobre la estructura generada dinámicamente
                // Usamos un retraso progresivo para la animación de aparición
                let delayCount = 0;
                roseStructure.forEach(data => {
                    createBlock(data[0], data[1], data[2], data[3], delayCount * 40);
                    delayCount++;
                });

                // Iniciar el bucle de renderizado optimizado
                requestAnimationFrame(updateRotation);
            }, 500);
        }

        // --- Lógica de Interacción Unificada (Mouse y Táctil) ---
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;

        function getEventPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].pageX, y: e.touches[0].pageY };
            }
            return { x: e.pageX, y: e.pageY };
        }

        function onStart(e) {
            isDragging = true;
            const pos = getEventPos(e);
            lastX = pos.x;
            lastY = pos.y;
            if(e.type === 'touchstart') e.preventDefault(); // Evitar scroll en móvil
        }

        function onMove(e) {
            if (!isDragging) return;
            const pos = getEventPos(e);
            const deltaX = pos.x - lastX;
            const deltaY = pos.y - lastY;

            targetRotY += deltaX * sensitivity;
            targetRotX -= deltaY * sensitivity; // Invertido para naturalidad

            // Limitar rotación vertical (X) para no "dar la vuelta"
            targetRotX = Math.max(-60, Math.min(60, targetRotX));

            lastX = pos.x;
            lastY = pos.y;
        }

        function onEnd() {
            isDragging = false;
        }

        // Eventos Mouse
        window.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        // Eventos Táctiles (móvil) con { passive: false } para preventDefault
        window.addEventListener('touchstart', onStart, { passive: false });
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onEnd);


        // --- Bucle de Renderizado Suavizado (Lerp) ---
        // Lerp: valor_actual = valor_actual + (valor_objetivo - valor_actual) * suavizado
        function updateRotation() {
            // Interpolación lineal (Lerp) para suavizar
            currentRotY += (targetRotY - currentRotY) * smoothness;
            currentRotX += (targetRotX - currentRotX) * smoothness;

            // Aplicar transformación 3D al pivot
            dom.pivot.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;

            // Siguiente frame
            requestAnimationFrame(updateRotation);
        }

        // --- Iniciar todo ---
        simulateLoading();

    </script>
</body>
</html>
