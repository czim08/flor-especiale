<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rare Item 3D - Optimizado</title>
    <style>
        :root {
            --bg-color: #121212; /* Fondo oscuro tipo Nether */
            --bar-color: #ff4d4d; /* Rojo intenso para la carga */
            --text-color: #ffffff;
            --rare-color: #ffaa00; /* Dorado para el texto "Rare Item" */
        }

        * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; }

        body {
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', monospace; /* Tipografía tipo Minecraft */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* --- Pantalla de Carga (Loader) --- */
        #loader {
            position: absolute;
            text-align: center;
            z-index: 100;
            transition: opacity 0.5s ease;
            width: 100%;
        }

        #status { font-weight: 300; margin-bottom: 15px; font-size: 1.1rem; text-transform: uppercase; }

        .loading-bar-container {
            width: 220px; height: 10px;
            border: 2px solid white;
            margin: 0 auto;
            position: relative;
            background: rgba(0,0,0,0.5);
        }

        #bar {
            width: 0%; height: 100%;
            background-color: var(--bar-color);
            transition: width 0.1s linear;
            box-shadow: 0 0 10px var(--bar-color);
        }

        /* --- Contenedor Principal (Scene) --- */
        .scene {
            width: 100vw; height: 100vh;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #pivot {
            position: relative;
            transform-style: preserve-3d;
            /* Inclinación base optimizada */
            transform: rotateX(-15deg) rotateY(45deg);
            will-change: transform; /* Ayuda al rendimiento */
        }

        /* --- El Modelo (Planos Cruzados) --- */
        .flower-model {
            position: absolute;
            transform-style: preserve-3d;
            /* Centrar el modelo */
            margin-left: -75px; /* -(width/2) */
            margin-top: -150px; /* -height */
            width: 150px;
            height: 150px;
        }

        .sprite-plane {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: 100% 100%;
            image-rendering: pixelated; /* ¡Look Minecraft! */
            
            /* --- GENERADOR DE TEXTURA DE ROSA (CSS Puro) --- */
            /* Capa 1: El capullo rojo con degradado radial */
            background-image: 
                radial-gradient(circle at 50% 30%, #ff1a1a 0%, #b30000 40%, transparent 50%),
                /* Capa 2: El tallo verde con degradado lineal */
                linear-gradient(to top, transparent 0%, #00cc44 10%, #006622 50%, transparent 60%);
            
            /* Sombra suave para dar volumen */
            filter: drop-shadow(0 0 5px rgba(255,0,0,0.3));
        }

        /* Plano 1: Normal */
        .p1 { transform: rotateY(0deg); }
        /* Plano 2: Girado 90 grados para crear la cruz (+) */
        .p2 { transform: rotateY(90deg); }

        /* --- Sombra en el suelo para realismo --- */
        .shadow {
            position: absolute;
            width: 100px; height: 100px;
            background: radial-gradient(circle, rgba(0,0,0,0.7) 0%, transparent 70%);
            transform: rotateX(90deg) translateZ(-10px);
            margin-left: -50px;
            margin-top: -50px;
        }

        /* --- Texto de Instrucciones --- */
        #instructions {
            position: absolute;
            bottom: 30px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border: 2px solid white;
        }

        #instructions h1 {
            color: var(--rare-color); /* Dorado */
            font-size: 1.3rem;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        #instructions p {
            font-size: 0.9rem;
            color: #ccc;
            line-height: 1.3;
        }

        /* Ajuste para pantallas muy pequeñas */
        @media (max-height: 500px) {
            #instructions { bottom: 10px; padding: 10px; }
            #instructions h1 { font-size: 1.1rem; }
        }

    </style>
</head>
<body>

    <div id="loader">
        <h2 id="status">Generando chunk...</h2>
        <div class="loading-bar-container">
            <div id="bar"></div>
        </div>
    </div>

    <div class="scene" id="mainScene">
        <div id="pivot">
            <div class="flower-model">
                <div class="sprite-plane p1"></div>
                <div class="sprite-plane p2"></div>
            </div>
            <div class="shadow"></div>
        </div>
    </div>

    <div id="instructions">
        <h1>[RARE ITEM]</h1>
        <p>Para una persona tan especial como tú.</p>
        <p style="font-size: 0.8rem; color: #888; margin-top: 5px;">(Arrastra para girar)</p>
    </div>

    <script>
        // --- Elementos del DOM ---
        const dom = {
            loader: document.getElementById('loader'),
            bar: document.getElementById('bar'),
            status: document.getElementById('status'),
            scene: document.getElementById('mainScene'),
            pivot: document.getElementById('pivot'),
            instructions: document.getElementById('instructions')
        };

        // --- Configuración de Rotación Suavizada ---
        let targetRotY = 45;
        let targetRotX = -15;
        let currentRotY = 45;
        let currentRotX = -15;
        
        // Sensibilidad táctil/mouse (ajusta si lo sientes muy rápido/lento)
        const sensitivity = 0.4; 
        // Suavizado (0.01 a 1, más bajo es más suave/lento)
        const smoothness = 0.12; 

        // --- Simulación de Carga (5 segundos) ---
        function simulateLoading() {
            let progress = 0;
            const startTime = Date.now();
            const duration = 5000; // 5 segundos

            const phrases = [
                "Generando terreno...",
                "Buscando bioma raro...",
                "Crafteando pétalos...",
                "Encantando objeto...",
                "Casi listo..."
            ];

            const interval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                progress = (elapsed / duration) * 100;

                if (progress >= 100) {
                    dom.bar.style.width = '100%';
                    dom.status.innerText = "¡Crafteado!";
                    dom.status.style.color = "var(--rare-color)";
                    clearInterval(interval);
                    setTimeout(showScene, 600);
                } else {
                    dom.bar.style.width = progress + '%';
                    // Cambiar frase aleatoriamente para dar feedback
                    if (Math.random() > 0.94) {
                        dom.status.innerText = phrases[Math.floor(Math.random() * phrases.length)];
                    }
                }
            }, 50);
        }

        // --- Mostrar la Escena ---
        function showScene() {
            dom.loader.style.opacity = '0';
            setTimeout(() => {
                dom.loader.remove();
                dom.scene.style.opacity = '1';
                dom.instructions.style.opacity = '1';
                // Iniciar el bucle de renderizado optimizado
                requestAnimationFrame(updateRotation);
            }, 500);
        }

        // --- Lógica de Interacción Unificada (Mouse y Táctil) ---
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;

        function getEventPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].pageX, y: e.touches[0].pageY };
            }
            return { x: e.pageX, y: e.pageY };
        }

        function onStart(e) {
            isDragging = true;
            const pos = getEventPos(e);
            lastX = pos.x;
            lastY = pos.y;
            // Evita comportamientos extraños en móvil
            if(e.type === 'touchstart') e.preventDefault(); 
        }

        function onMove(e) {
            if (!isDragging) return;
            
            const pos = getEventPos(e);
            const deltaX = pos.x - lastX;
            const deltaY = pos.y - lastY;

            targetRotY += deltaX * sensitivity;
            targetRotX -= deltaY * sensitivity; // Invertido para naturalidad

            // Limitar rotación vertical (X) para no "dar la vuelta"
            targetRotX = Math.max(-50, Math.min(50, targetRotX));

            lastX = pos.x;
            lastY = pos.y;
        }

        function onEnd() {
            isDragging = false;
        }

        // Eventos de Mouse
        window.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        // Eventos Táctiles (móvil, con { passive: false } para preventDefault)
        window.addEventListener('touchstart', onStart, { passive: false });
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onEnd);


        // --- Bucle de Renderizado (Suavizado con Lerp) ---
        // Lerp: valor_actual = valor_actual + (valor_objetivo - valor_actual) * suavizado
        function updateRotation() {
            if (!isDragging) {
                // Si no arrastras, vuelve suavemente a la inclinación X base
                targetRotX += (-15 - targetRotX) * (smoothness * 0.2);
            }

            // Interpolación lineal para suavizar
            currentRotY += (targetRotY - currentRotY) * smoothness;
            currentRotX += (targetRotX - currentRotX) * smoothness;

            // Aplicar transformación 3D al pivot
            dom.pivot.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;

            // Siguiente frame
            requestAnimationFrame(updateRotation);
        }

        // --- Iniciar todo ---
        simulateLoading();

    </script>
</body>
</html>
