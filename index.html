<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Block Rose 3D - Accurate</title>
    <style>
        /* --- Configuración y Paleta de Minecraft --- */
        :root {
            --bg-color: #2c2c2c; /* Fondo oscuro tipo Nether/Cueva */
            --mc-text-shadow: 2px 2px 0px #000;
            --bar-color: #ff4d4d; /* Rojo de carga */
            
            /* Tamaños */
            --block-size: 15px; /* Tamaño de un bloque unitario */
            
            /* Paleta de Bloques - Degradados para profundidad por cara */
            /* Rojo - Capullo */
            --red-f: radial-gradient(#ff3333, #e60000); /* Frontal */
            --red-t: #ff6666; /* Superior */
            --red-s: #b30000; /* Lateral */
            
            /* Verde - Tallo/Hojas */
            --green-f: radial-gradient(#33cc33, #1a991a);
            --green-t: #66ff66;
            --green-s: #0d660d;

            /* Verde Oscuro - Base/Conexiones */
            --dgreen-f: radial-gradient(#1a991a, #0d660d);
            --dgreen-t: #33cc33;
            --dgreen-s: #064d06;
        }

        /* --- Resets y Globales --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: none; /* Desactivar gestos del navegador */
        }

        body {
            height: 100vh;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Courier New', monospace; /* Tipografía tipo MC */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none; /* No seleccionar texto al arrastrar */
        }

        /* --- Pantalla de Carga (Minecraft Style) --- */
        #loader {
            position: absolute;
            text-align: center;
            z-index: 100;
            transition: opacity 0.5s ease;
            width: 100%;
        }

        #loader h2 {
            font-weight: 300;
            margin-bottom: 20px;
            font-size: 1.2rem;
            text-transform: uppercase;
            text-shadow: var(--mc-text-shadow);
        }

        .loading-bar-container {
            width: 250px;
            height: 12px;
            border: 2px solid white;
            margin: 0 auto;
            position: relative;
            background: rgba(0,0,0,0.5);
        }

        #bar {
            width: 0%;
            height: 100%;
            background-color: var(--bar-color);
            transition: width 0.1s linear;
        }

        /* --- Contenedor Principal (Escena) --- */
        .scene {
            width: 100vw;
            height: 100vh;
            perspective: 1200px; /* Profundidad 3D */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; /* Invisible hasta carga completa */
            transition: opacity 1s ease;
        }

        #pivot {
            position: relative;
            transform-style: preserve-3d;
            /* Inclinación base para apreciar el volumen */
            transform: rotateX(-15deg) rotateY(45deg);
        }

        /* --- Definición del Bloque (Cubo) --- */
        .block {
            position: absolute;
            width: var(--block-size);
            height: var(--block-size);
            transform-style: preserve-3d;
            /* Suavizado de aparición individual */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Caras del Cubo */
        .face {
            position: absolute;
            width: var(--block-size);
            height: var(--block-size);
            border: 0.1px solid rgba(0,0,0,0.1); /* Micro-borde para definir bloque */
            image-rendering: pixelated; /* ¡Look pixelado! */
        }

        /* Orientación de las caras */
        .front  { transform: translateZ(calc(var(--block-size) / 2)); }
        .back   { transform: rotateY(180deg) translateZ(calc(var(--block-size) / 2)); }
        .left   { transform: rotateY(-90deg) translateZ(calc(var(--block-size) / 2)); }
        .right  { transform: rotateY(90deg) translateZ(calc(var(--block-size) / 2)); }
        .top    { transform: rotateX(90deg) translateZ(calc(var(--block-size) / 2)); }
        .bottom { transform: rotateX(-90deg) translateZ(calc(var(--block-size) / 2)); }

        /* Estilos de Bloque - Aplicando degradados a las caras */
        /* Bloque Rojo */
        .block-red .front, .block-red .back { background: var(--red-f); }
        .block-red .left,  .block-red .right { background: var(--red-s); }
        .block-red .top                      { background: var(--red-t); }
        .block-red .bottom                   { background: var(--red-s); opacity: 0.8; }

        /* Bloque Verde */
        .block-green .front, .block-green .back { background: var(--green-f); }
        .block-green .left,  .block-green .right { background: var(--green-s); }
        .block-green .top                        { background: var(--green-t); }
        .block-green .bottom                     { background: var(--green-s); opacity: 0.8; }

        /* Bloque Verde Oscuro */
        .block-dgreen .front, .block-dgreen .back { background: var(--dgreen-f); }
        .block-dgreen .left,  .block-dgreen .right { background: var(--dgreen-s); }
        .block-dgreen .top                          { background: var(--dgreen-t); }
        .block-dgreen .bottom                       { background: var(--dgreen-s); opacity: 0.8; }


        /* --- Texto Inferior --- */
        #instructions {
            position: absolute;
            bottom: 30px;
            text-align: center;
            width: 90%;
            max-width: 450px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border: 2px solid white;
        }

        #instructions h1 {
            color: #ffaa00; /* Color "Rare" o "Gold" */
            font-size: 1.4rem;
            margin-bottom: 5px;
            font-weight: bold;
            text-shadow: var(--mc-text-shadow);
        }

        #instructions p {
            font-size: 0.95rem;
            color: #ddd;
        }

    </style>
</head>
<body>

    <div id="loader">
        <h2 id="status">Generando chunk...</h2>
        <div class="loading-bar-container">
            <div id="bar"></div>
        </div>
    </div>

    <div class="scene" id="mainScene">
        <div id="pivot">
            </div>
    </div>

    <div id="instructions">
        <h1>[RARE ITEM]</h1>
        <p>Una rosa crafteada para alguien tan especial como tú.</p>
        <p style="font-size: 0.8rem; color: #aaa; margin-top: 5px;">(Arrastra para explorar)</p>
    </div>

    <script>
        // --- Elementos del DOM ---
        const dom = {
            loader: document.getElementById('loader'),
            bar: document.getElementById('bar'),
            status: document.getElementById('status'),
            scene: document.getElementById('mainScene'),
            pivot: document.getElementById('pivot'),
            instructions: document.getElementById('instructions')
        };

        // --- Configuración de Bloques y Estructura Organica (basada en image_22/23) ---
        // Definimos la rosa como una lista de coordenadas [x, y, z, tipo_bloque, retraso_aparicion]
        // y = 0 es el suelo. x/z centrado en 0. y crece hacia arriba.
        const roseStructure = [
            // Tallo - Curvado (y=0 a y=5)
            [0, 0, 0, 'block-dgreen', 0],
            [1, 1, 0, 'block-green', 100],
            [1, 2, 0, 'block-green', 200],
            [0, 3, 0, 'block-green', 300],
            [-1, 4, 0, 'block-dgreen', 400],
            [0, 5, 0, 'block-dgreen', 500], // Base del capullo

            // Hojas laterales - Curvadas y asimétricas
            // Hoja 1 (inferior derecha)
            [2, 2, 0, 'block-green', 250],
            [3, 3, 1, 'block-green', 350],
            [2, 3, 1, 'block-dgreen', 400],

            // Hoja 2 (superior izquierda)
            [-2, 4, 0, 'block-green', 450],
            [-3, 5, -1, 'block-green', 550],
            [-2, 5, -1, 'block-dgreen', 600],

            // Capullo - Base Conica (y=6 a y=7) - (Verde Oscuro a Rojo)
            [0, 6, 0, 'block-red', 650],  // Centro inferior
            [1, 6, 0, 'block-dgreen', 700],
            [-1, 6, 0, 'block-dgreen', 700],
            [0, 6, 1, 'block-dgreen', 700],
            [0, 6, -1, 'block-dgreen', 700],

            // Capullo - Cuerpo Principal (y=7) - Voluminoso y asimétrico
            [0, 7, 0, 'block-red', 750],   // Nucleo
            [1, 7, 0, 'block-red', 800],
            [-1, 7, 0, 'block-red', 800],
            [0, 7, 1, 'block-red', 800],
            [0, 7, -1, 'block-red', 800],
            [1, 7, 1, 'block-red', 850],   // Esquinas
            [-1, 7, -1, 'block-red', 850],
            [1, 7, -1, 'block-red', 850],
            [-1, 7, 1, 'block-red', 850],
            
            // Capullo - Pétalos Exteriores Desordenados (y=7/8)
            [2, 7, 0, 'block-red', 900],   // Extremo derecho
            [-2, 8, 0, 'block-red', 950],  // Extremo izquierdo superior

            // Capullo - Parte Superior (y=8/9) - Más pequeña y detallada
            [0, 8, 0, 'block-red', 950],   // Nucleo superior
            [1, 8, 0, 'block-red', 1000],
            [-1, 8, 0, 'block-red', 1000],
            [0, 8, 1, 'block-red', 1000],
            [0, 8, -1, 'block-red', 1000],
            
            [0, 9, 0, 'block-red', 1050],  // Pétalo central más alto
            [1, 9, 1, 'block-red', 1100],  // Pétalo asimétrico alto
        ];

        // --- Generador Automático de Bloques ---
        function createBlock(x, y, z, blockClass, delay) {
            const block = document.createElement('div');
            block.className = `block ${blockClass}`;
            
            // Posicionamiento 3D inicial (escalado a 0 para aparición suave)
            // Usamos unidades de bloque para x/y/z y lo convertimos a px
            block.style.transform = `translate3d(calc(${x} * var(--block-size)), calc(${-y} * var(--block-size)), calc(${z} * var(--block-size))) scale(0)`;
            
            // Crear las 6 caras
            const faces = ['front', 'back', 'left', 'right', 'top', 'bottom'];
            faces.forEach(faceName => {
                const face = document.createElement('div');
                face.className = `face ${faceName}`;
                block.appendChild(face);
            });

            // Añadir al pivot
            dom.pivot.appendChild(block);

            // Animación de aparición con retraso
            setTimeout(() => {
                block.style.transform = `translate3d(calc(${x} * var(--block-size)), calc(${-y} * var(--block-size)), calc(${z} * var(--block-size))) scale(1)`;
            }, delay);
        }

        // --- Configuración de Rotación Suavizada ---
        let targetRotY = 45;
        let targetRotX = -15;
        let currentRotY = 45;
        let currentRotX = -15;
        const sensitivity = 0.5; // Sensibilidad al arrastrar
        const smoothness = 0.15; // Factor de suavizado (0.01 a 1)

        // --- Simulación de Carga (4 segundos) ---
        function simulateLoading() {
            let progress = 0;
            const startTime = Date.now();
            const duration = 4000; // 4 segundos

            const phrases = [
                "Generando chunks...",
                "Buscando el bioma perfecto...",
                "Plantando semillas voxel...",
                "Crafteando pétalos...",
                "Casi listo..."
            ];

            const interval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                progress = (elapsed / duration) * 100;

                if (progress >= 100) {
                    dom.bar.style.width = '100%';
                    dom.status.innerText = "¡Crafteado!";
                    dom.status.style.color = "#ffaa00";
                    clearInterval(interval);
                    setTimeout(showScene, 500);
                } else {
                    dom.bar.style.width = progress + '%';
                    // Cambiar frase aleatoriamente
                    if (Math.random() > 0.95) {
                        dom.status.innerText = phrases[Math.floor(Math.random() * phrases.length)];
                    }
                }
            }, 50);
        }

        // --- Mostrar la Escena y Generar Rosa ---
        function showScene() {
            // Ocultar carga, mostrar escena
            dom.loader.style.opacity = '0';
            setTimeout(() => {
                dom.loader.remove();
                dom.scene.style.opacity = '1';
                dom.instructions.style.opacity = '1';

                // --- GENERAR LA ROSA DE BLOQUES ---
                // Iterar sobre la estructura definida arriba
                roseStructure.forEach(data => {
                    // Esperar un poco más para que la escena aparezca antes de los bloques
                    const delayedStart = 500; 
                    createBlock(data[0], data[1], data[2], data[3], data[4] + delayedStart);
                });

                // Iniciar el bucle de renderizado optimizado
                requestAnimationFrame(updateRotation);
            }, 500);
        }

        // --- Lógica de Interacción (Unificada: Mouse y Táctil) ---
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;

        function getEventPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].pageX, y: e.touches[0].pageY };
            }
            return { x: e.pageX, y: e.pageY };
        }

        function onStart(e) {
            isDragging = true;
            const pos = getEventPos(e);
            lastX = pos.x;
            lastY = pos.y;
            if(e.type === 'touchstart') e.preventDefault(); // Evitar scroll en móvil
        }

        function onMove(e) {
            if (!isDragging) return;
            const pos = getEventPos(e);
            const deltaX = pos.x - lastX;
            const deltaY = pos.y - lastY;

            targetRotY += deltaX * sensitivity;
            targetRotX -= deltaY * sensitivity; // Invertido para naturalidad

            // Limitar rotación vertical (X) para no "dar la vuelta"
            targetRotX = Math.max(-60, Math.min(60, targetRotX));

            lastX = pos.x;
            lastY = pos.y;
        }

        function onEnd() {
            isDragging = false;
        }

        // Eventos Mouse
        window.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        // Eventos Táctiles (móvil) con { passive: false } para preventDefault
        window.addEventListener('touchstart', onStart, { passive: false });
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onEnd);


        // --- Bucle de Renderizado Suavizado (Lerp) ---
        // Lerp: valor_actual = valor_actual + (valor_objetivo - valor_actual) * suavizado
        function updateRotation() {
            // Interpolación lineal (Lerp) para suavizar
            currentRotY += (targetRotY - currentRotY) * smoothness;
            currentRotX += (targetRotX - currentRotX) * smoothness;

            // Aplicar transformación 3D al pivot
            dom.pivot.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;

            // Siguiente frame
            requestAnimationFrame(updateRotation);
        }

        // --- Iniciar todo ---
        simulateLoading();

    </script>
</body>
</html>
