<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa 3D - Generación Activa</title>
    <style>
        :root {
            --bg: #050505;
            --rose-red: #ff002b;
            --stem-green: #1a7431;
        }

        body {
            background-color: var(--bg);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            perspective: 1000px;
        }

        /* Pantalla de carga */
        #loader {
            position: absolute;
            color: white;
            text-align: center;
            z-index: 100;
        }

        .scene {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        #pivot {
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(45deg);
            will-change: transform;
        }

        .pixel {
            position: absolute;
            width: 8px;
            height: 8px;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .face {
            position: absolute;
            width: 8px;
            height: 8px;
            backface-visibility: hidden; /* Optimización clave */
        }

        /* Caras simplificadas para rendimiento */
        .f { transform: translateZ(4px); background: rgba(0,0,0,0.3); }
        .t { transform: rotateX(90deg) translateZ(4px); }

        .ui-text {
            position: absolute;
            top: 20px;
            color: white;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 15px var(--rose-red);
            z-index: 10;
        }

        #bar-container {
            width: 250px;
            height: 4px;
            background: #222;
            margin-top: 15px;
        }

        #bar {
            width: 0%;
            height: 100%;
            background: var(--rose-red);
            box-shadow: 0 0 10px var(--rose-red);
        }
    </style>
</head>
<body>

    <div id="loader">
        <h2 id="status">INICIALIZANDO MUNDO...</h2>
        <div id="bar-container"><div id="bar"></div></div>
    </div>

    <div class="ui-text" id="instructions" style="display:none;">
        <h1>PARA TI</h1>
        <p>Arrastra para rotar la rosa</p>
    </div>

    <div class="scene">
        <div id="pivot"></div>
    </div>

<script>
    const pivot = document.getElementById('pivot');
    const loader = document.getElementById('loader');
    const bar = document.getElementById('bar');
    const instructions = document.getElementById('instructions');

    let rotY = 45;
    let rotX = -20;

    // Función para crear bloques optimizados
    function createPixel(x, y, z, color) {
        const pixel = document.createElement('div');
        pixel.className = 'pixel';
        pixel.style.transform = `translate3d(${x}px, ${y}px, ${z}px) scale(0)`;
        
        // Solo creamos 2 caras por cubo para que 1000 bloques no maten el PC
        // Pero se ve como un bloque sólido por el ángulo
        const faces = ['f', 't']; 
        faces.forEach(f => {
            const div = document.createElement('div');
            div.className = `face ${f}`;
            div.style.backgroundColor = color;
            pixel.appendChild(div);
        });

        pivot.appendChild(pixel);
        
        // Animación suave de entrada
        requestAnimationFrame(() => {
            pixel.style.transition = "transform 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67)";
            pixel.style.transform = `translate3d(${x}px, ${y}px, ${z}px) scale(1)`;
        });
    }

    async function build() {
        // 1. Fase de espera (5 segundos)
        let progress = 0;
        const interval = setInterval(() => {
            progress += 1;
            bar.style.width = progress + "%";
            if(progress >= 100) clearInterval(interval);
        }, 50);

        await new Promise(r => setTimeout(r, 5000));
        
        // 2. Transición
        loader.style.display = "none";
        instructions.style.display = "block";

        // 3. Construcción del Tallo
        for (let i = 0; i < 20; i++) {
            createPixel(0, 160 - (i * 8), 0, 'var(--stem-green)');
            await new Promise(r => setTimeout(r, 40));
        }

        // 4. Construcción de la Gran Rosa (1000 bloques en ráfagas)
        for (let i = 0; i < 1000; i++) {
            const angle = 0.2 * i;
            const r = 1.2 * Math.sqrt(i);
            const x = r * Math.cos(angle) * 8;
            const z = r * Math.sin(angle) * 8;
            const y = - (i / 15) + (r * r * 0.02);

            const red = 200 + Math.random() * 55;
            createPixel(x, y, z, `rgb(${red}, 10, 40)`);

            // Cada 20 bloques, damos un respiro al navegador para que no se trabe
            if (i % 20 === 0) await new Promise(r => setTimeout(r, 10));
        }
    }

    // Interacción de rotación
    let isDragging = false;
    let pX, pY;

    document.addEventListener('mousedown', e => { isDragging = true; pX = e.clientX; pY = e.clientY; });
    document.addEventListener('mousemove', e => {
        if (!isDragging) return;
        rotY += (e.clientX - pX) * 0.5;
        rotX -= (e.clientY - pY) * 0.5;
        pivot.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        pX = e.clientX; pY = e.clientY;
    });
    document.addEventListener('mouseup', () => isDragging = false);

    // Soporte Táctil
    document.addEventListener('touchstart', e => { isDragging = true; pX = e.touches[0].clientX; pY = e.touches[0].clientY; });
    document.addEventListener('touchmove', e => {
        if (!isDragging) return;
        rotY += (e.touches[0].clientX - pX) * 0.5;
        rotX -= (e.touches[0].clientY - pY) * 0.5;
        pivot.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        pX = e.touches[0].clientX; pY = e.touches[0].clientY;
    });
    document.addEventListener('touchend', () => isDragging = false);

    window.onload = build;
</script>
</body>
</html>
