<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Pixelada en Construcción</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --rose-red: #e63946;
            --leaf-green: #2b9348;
            --stem-green: #004b23;
        }

        body {
            background-color: var(--bg);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: none;
        }

        /* Pantalla de carga */
        #loader {
            position: absolute;
            color: white;
            text-align: center;
            z-index: 100;
            transition: opacity 1s ease;
        }

        .scene {
            width: 400px;
            height: 400px;
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; /* Invisible hasta que termine la carga */
            transition: opacity 2s ease;
        }

        #pivot {
            position: relative;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(45deg);
        }

        .pixel {
            position: absolute;
            width: 10px;
            height: 10px;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .face {
            position: absolute;
            width: 10px;
            height: 10px;
            border: 0.1px solid rgba(0,0,0,0.2);
        }

        .f { transform: translateZ(5px); }
        .bk { transform: rotateY(180deg) translateZ(5px); }
        .l { transform: rotateY(-90deg) translateZ(5px); }
        .r { transform: rotateY(90deg) translateZ(5px); }
        .t { transform: rotateX(90deg) translateZ(5px); }
        .bm { transform: rotateX(-90deg) translateZ(5px); }

        .ui-text {
            position: absolute;
            top: 20px;
            color: white;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>

    <div id="loader">
        <h2 id="status">Generando terreno...</h2>
        <div style="width: 200px; height: 10px; border: 1px solid white; margin: 0 auto;">
            <div id="bar" style="width: 0%; height: 100%; background: var(--rose-red); transition: width 5s linear;"></div>
        </div>
    </div>

    <div class="ui-text" id="instructions">
        <h1 style="color: var(--rose-red);">UNA ROSA PARA TI</h1>
        <p>Arrastra para explorar cada pétalo</p>
    </div>

    <div class="scene" id="mainScene">
        <div id="pivot"></div>
    </div>

<script>
    const pivot = document.getElementById('pivot');
    const loader = document.getElementById('loader');
    const scene = document.getElementById('mainScene');
    const bar = document.getElementById('bar');
    const instructions = document.getElementById('instructions');

    let rotY = 45;
    let rotX = -20;

    // --- GENERADOR DE BLOQUES ---
    function createPixel(x, y, z, color, delay) {
        const pixel = document.createElement('div');
        pixel.className = 'pixel';
        // Empiezan desde el centro y escalados a 0
        pixel.style.transform = `translate3d(0, 0, 0) scale(0)`;
        
        const faces = ['f', 'bk', 'l', 'r', 't', 'bm'];
        faces.forEach(face => {
            const div = document.createElement('div');
            div.className = `face ${face}`;
            div.style.backgroundColor = color;
            pixel.appendChild(div);
        });

        pivot.appendChild(pixel);

        // Animación de aparición con retraso
        setTimeout(() => {
            pixel.style.transform = `translate3d(${x}px, ${y}px, ${z}px) scale(1)`;
        }, delay);
    }

    // --- SECUENCIA DE CONSTRUCCIÓN ---
    async function startSequence() {
        // 1. Iniciar barra de carga
        setTimeout(() => bar.style.width = "100%", 100);

        // 2. Esperar 5 segundos
        await new Promise(r => setTimeout(r, 5000));
        
        loader.style.opacity = "0";
        setTimeout(() => loader.remove(), 1000);

        // 3. Mostrar escena
        scene.style.opacity = "1";
        instructions.style.opacity = "1";

        let currentDelay = 0;

        // Construir Tallo (15 bloques)
        for (let y = 150; y >= 0; y -= 10) {
            createPixel(0, y, 0, 'var(--stem-green)', currentDelay);
            currentDelay += 50; 
        }

        // Construir Hojas (10 bloques)
        for (let i = 0; i < 50; i += 10) {
            createPixel(i + 10, 80 - i/2, 0, 'var(--leaf-green)', currentDelay);
            createPixel(-i - 10, 110 - i/2, 0, 'var(--leaf-green)', currentDelay);
            currentDelay += 30;
        }

        // Construir Capullo (+1000
