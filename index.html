<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Rose Pro</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --size: 10px; /* Tamaño bloque */
        }
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body { background: var(--bg); overflow: hidden; font-family: 'Courier New', monospace; }

        /* Escena */
        .viewport {
            width: 100vw; height: 100vh;
            perspective: 1000px;
            display: flex; justify-content: center; align-items: center;
        }
        .world {
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(45deg);
            will-change: transform;
        }

        /* Bloque Base */
        .b {
            position: absolute; width: var(--size); height: var(--size);
            transform-style: preserve-3d;
        }
        .f {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            border: 0.5px solid rgba(0,0,0,0.1);
        }

        /* Caras */
        .front  { transform: translateZ(calc(var(--size)/2)); }
        .back   { transform: rotateY(180deg) translateZ(calc(var(--size)/2)); }
        .top    { transform: rotateX(90deg) translateZ(calc(var(--size)/2)); }
        .bottom { transform: rotateX(-90deg) translateZ(calc(var(--size)/2)); }
        .left   { transform: rotateY(-90deg) translateZ(calc(var(--size)/2)); }
        .right  { transform: rotateY(90deg) translateZ(calc(var(--size)/2)); }

        /* Colores */
        .red .f { background: #e60000; }
        .red .top { background: #ff3333; }
        .red .right, .red .left { background: #b30000; }
        
        .green .f { background: #2d8d2d; }
        .green .top { background: #45c045; }

        /* UI */
        .ui {
            position: absolute; bottom: 5%; width: 100%; text-align: center;
            pointer-events: none; z-index: 10;
        }
        .box {
            display: inline-block; background: rgba(0,0,0,0.8);
            border: 2px solid #fff; padding: 15px; max-width: 80%;
        }
        .rare { color: #ffaa00; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .msg { color: #fff; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="viewport" id="v">
    <div class="world" id="w"></div>
</div>

<div class="ui">
    <div class="box">
        <div class="rare">[LEGENDARY ITEM]</div>
        <div class="msg">ítem raro para una persona especial osea tu</div>
    </div>
</div>

<script>
    const world = document.getElementById('w');
    const blocks = [];

    // Función para añadir bloques rápido
    function addB(x, y, z, type) {
        const b = document.createElement('div');
        b.className = `b ${type}`;
        b.style.transform = `translate3d(${x*10}px, ${-y*10}px, ${z*10}px)`;
        b.innerHTML = '<div class="f front"></div><div class="f back"></div><div class="f top"></div><div class="f bottom"></div><div class="f left"></div><div class="f right"></div>';
        world.appendChild(b);
    }

    // 1. Tallo (Curvo)
    for(let i=0; i<12; i++) {
        let x = Math.sin(i*0.4)*1.2;
        addB(Math.round(x), i, 0, 'green');
    }

    // 2. Hojas
    addB(1, 4, 0, 'green'); addB(2, 5, 0, 'green');
    addB(-1, 7, 0, 'green'); addB(-2, 8, 0, 'green');

    // 3. CAPULLO (Hollow/Hueco para fluidez)
    const ry = 12; // Altura base capullo
    // Capas exteriores (Pétalos)
    for(let i=-2; i<=2; i++) {
        for(let j=-2; j<=2; j++) {
            if(Math.abs(i) === 2 || Math.abs(j) === 2) {
                addB(i, ry, j, 'red');
                addB(i, ry+1, j, 'red');
            }
        }
    }
    // Capa media
    for(let i=-1; i<=1; i++) {
        for(let j=-1; j<=1; j++) {
            addB(i, ry+2, j, 'red');
            if(i===0 || j===0) addB(i, ry+3, j, 'red');
        }
    }
    // Punta
    addB(0, ry+4, 0, 'red');

    // Interacción
    let rx = -20, ry_rot = 45;
    document.addEventListener('touchmove', (e) => {
        ry_rot += e.touches[0].pageX * 0.005; // Ajuste ultra suave
        world.style.transform = `rotateX(${rx}deg) rotateY(${ry_rot}deg)`;
    });
    
    // Mouse
    let mDown = false;
    document.addEventListener('mousedown', () => mDown = true);
    document.addEventListener('mouseup', () => mDown = false);
    document.addEventListener('mousemove', (e) => {
        if(!mDown) return;
        ry_rot += e.movementX * 0.5;
        rx -= e.movementY * 0.5;
        world.style.transform = `rotateX(${rx}deg) rotateY(${ry_rot}deg)`;
    });

</script>
</body>
</html>
