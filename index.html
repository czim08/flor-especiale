<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Legendary Rose - Optimized</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --block-size: 11px; /* Un poco más pequeña para ganar rendimiento */
            --red-f: #ff1a1a; --red-t: #ff4d4d; --red-s: #990000;
            --green-f: #2eb82e; --green-t: #5cd65c; --green-s: #145214;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }

        body {
            height: 100vh;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Pantalla de carga */
        #loader {
            position: absolute;
            text-align: center;
            z-index: 100;
            width: 100%;
        }

        .loading-bar-container {
            width: 200px; height: 10px;
            border: 2px solid white;
            margin: 15px auto;
            background: rgba(0,0,0,0.5);
        }

        #bar { width: 0%; height: 100%; background: #ff3333; }

        /* Escena 3D */
        .scene {
            perspective: 1000px;
            opacity: 0;
            transition: opacity 1s;
            will-change: opacity;
        }

        #pivot {
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-15deg) rotateY(45deg);
            will-change: transform;
        }

        /* El Cubo Voxel */
        .block {
            position: absolute;
            width: var(--block-size);
            height: var(--block-size);
            transform-style: preserve-3d;
            will-change: transform;
        }

        .face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden; /* CRÍTICO: No renderiza lo que no se ve */
        }

        .f { transform: translateZ(5.5px); }
        .bk { transform: rotateY(180deg) translateZ(5.5px); }
        .l { transform: rotateY(-90deg) translateZ(5.5px); }
        .r { transform: rotateY(90deg) translateZ(5.5px); }
        .t { transform: rotateX(90deg) translateZ(5.5px); }
        .bm { transform: rotateX(-90deg) translateZ(5.5px); }

        /* Colores */
        .r-b .face { background: var(--red-f); } .r-b .t { background: var(--red-t); } .r-b .l, .r-b .r { background: var(--red-s); }
        .g-b .face { background: var(--green-f); } .g-b .t { background: var(--green-t); } .g-b .l, .g-b .r { background: var(--green-s); }

        #instructions {
            position: absolute;
            bottom: 20px;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border: 1px solid gold;
            opacity: 0;
            transition: 1s;
        }
    </style>
</head>
<body>

    <div id="loader">
        <h2 id="status">Cargando...</h2>
        <div class="loading-bar-container"><div id="bar"></div></div>
    </div>

    <div class="scene" id="mainScene">
        <div id="pivot"></div>
    </div>

    <div id="instructions">
        <h1 style="color: gold; font-size: 1.2rem;">[RARE ITEM]</h1>
        <p>Para la persona más especial.</p>
    </div>

    <script>
        const pivot = document.getElementById('pivot');
        const bar = document.getElementById('bar');

        // Estructura simplificada pero visualmente densa
        const roseBlocks = [];
        // Tallo
        for(let i=0; i<10; i++) roseBlocks.push({x: Math.sin(i*0.3), y: i, z: 0, c: 'g-b'});
        // Hojas
        roseBlocks.push({x: 1, y: 3, z: 0, c: 'g-b'}, {x: 2, y: 4, z: 0, c: 'g-b'}, {x: -1, y: 5, z: 0, c: 'g-b'});
        // Capullo (Estructura de diamante)
        for(let y=10; y<15; y++) {
            let r = y < 13 ? y-9 : 15-y;
            for(let x=-r; x<=r; x++) {
                for(let z=-r; z<=r; z++) {
                    if(Math.abs(x)+Math.abs(z) <= r) roseBlocks.push({x, y, z, c: 'r-b'});
                }
            }
        }

        let currentIdx = 0;
        function chunkedBuild() {
            const chunkSize = 15; // Crea 15 bloques por vez
            for(let i=0; i<chunkSize && currentIdx < roseBlocks.length; i++) {
                const b = roseBlocks[currentIdx];
                const el = document.createElement('div');
                el.className = `block ${b.c}`;
                el.style.transform = `translate3d(${b.x * 12}px, ${-b.y * 12}px, ${b.z * 12}px)`;
                el.innerHTML = '<div class="face f"></div><div class="face bk"></div><div class="face l"></div><div class="face r"></div><div class="face t"></div><div class="face bm"></div>';
                pivot.appendChild(el);
                currentIdx++;
            }

            bar.style.width = (currentIdx / roseBlocks.length * 100) + '%';

            if(currentIdx < roseBlocks.length) {
                requestAnimationFrame(chunkedBuild); // Siguiente lote en el siguiente frame
            } else {
                startScene();
            }
        }

        function startScene() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('mainScene').style.opacity = '1';
            document.getElementById('instructions').style.opacity = '1';
            animate();
        }

        let rotY = 45, rotX = -15, tRotY = 45, tRotX = -15;
        window.onpointermove = e => {
            tRotY += e.movementX * 0.5;
            tRotX -= e.movementY * 0.5;
        };

        function animate() {
            rotY += (tRotY - rotY) * 0.1;
            rotX += (tRotX - rotX) * 0.1;
            pivot.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            requestAnimationFrame(animate);
        }

        // Iniciar construcción después de un segundo
        setTimeout(chunkedBuild, 1000);
    </script>
</body>
</html>
