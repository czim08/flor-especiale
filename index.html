<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Amor</title>
    <style>
        :root {
            --rose-color: #ff1a4a;
            --rose-dark: #b3002d;
            --glow: #ff4d79;
        }

        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #1a050d 0%, #050505 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        /* Estrellas de fondo */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 0;
        }

        /* Contenedor de la Rosa */
        .flower {
            position: relative;
            transform: scale(1.2);
            filter: drop-shadow(0 0 15px var(--glow));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1.2) rotate(-2deg); }
            50% { transform: translateY(-20px) scale(1.25) rotate(2deg); }
        }

        /* Pétalos */
        .petal {
            position: absolute;
            background: linear-gradient(45deg, var(--rose-dark), var(--rose-color));
            border-radius: 50% 50% 10% 80%;
            opacity: 0.9;
            transform-origin: bottom center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .center {
            width: 40px;
            height: 40px;
            background: var(--rose-dark);
            border-radius: 50%;
            position: absolute;
            top: -20px;
            left: -20px;
            z-index: 10;
            box-shadow: inset 0 0 10px #000;
        }

        /* Tallo */
        .stem {
            width: 8px;
            height: 300px;
            background: linear-gradient(to bottom, #1a4d1a, #0a290a);
            position: absolute;
            top: 20px;
            left: -4px;
            border-radius: 0 0 4px 4px;
            z-index: -1;
        }

        .leaf {
            position: absolute;
            width: 40px;
            height: 20px;
            background: linear-gradient(to right, #1a4d1a, #2d7a2d);
            border-radius: 0 100% 0 100%;
            top: 100px;
            left: 5px;
            transform-origin: left;
            animation: breeze 3s ease-in-out infinite;
        }

        .leaf.right {
            left: -40px;
            transform: scaleX(-1);
            top: 150px;
        }

        @keyframes breeze {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(10deg); }
        }

        /* Texto */
        .dedication {
            position: absolute;
            bottom: 50px;
            color: white;
            text-align: center;
            width: 100%;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 1.2rem;
            text-shadow: 0 0 10px var(--glow);
            opacity: 0;
            animation: fadeIn 3s forwards 2s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="stars" id="starField"></div>

    <div class="flower" id="rose">
        <div class="stem">
            <div class="leaf"></div>
            <div class="leaf right"></div>
        </div>
        <div class="center"></div>
    </div>

    <div class="dedication">
        Eres la flor más bella de mi jardín
    </div>

    <script>
        const rose = document.getElementById('rose');
        const starField = document.getElementById('starField');

        // Crear pétalos de forma procedural
        for (let i = 0; i < 30; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal';
            
            const size = 100 - (i * 2);
            const rotation = i * 45;
            const delay = i * 0.1;
            
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            petal.style.top = `-${size/2}px`;
            petal.style.left = `-${size/2}px`;
            petal.style.transform = `rotate(${rotation}deg) scale(0)`;
            petal.style.animation = `bloom 1.5s ease-out ${delay}s forwards`;
            
            rose.appendChild(petal);
        }

        // Crear estrellas
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.width = '2px';
            star.style.height = '2px';
            star.style.background = 'white';
            star.style.borderRadius = '50%';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.opacity = Math.random();
            starField.appendChild(star);
        }

        // Estilo de la animación de florecer
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes bloom {
                to { transform: rotate(var(--rot)) scale(1) translateY(-10px); }
            }
        `;
        document.head.appendChild(styleSheet);

        // Aplicar la rotación individual a cada pétalo
        document.querySelectorAll('.petal').forEach((p, index) => {
            p.style.setProperty('--rot', `${index * 25}deg`);
        });
    </script>
</body>
</html>
