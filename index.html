<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rare Item - Minecraft Rose</title>
    <style>
        body { 
            margin: 0; 
            /* Atardecer cálido */
            background: linear-gradient(180deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%); 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace; 
        }
        #ui {
            position: absolute;
            top: 40px; width: 100%; text-align: center;
            color: #ffffff; text-shadow: 2px 2px 8px rgba(214, 45, 32, 0.5);
            font-size: 3.5rem; pointer-events: none; font-weight: bold;
            letter-spacing: 5px;
        }
        #controls {
            position: absolute;
            bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; background: rgba(255,255,255,0.4);
            padding: 15px 30px; border-radius: 50px; backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            z-index: 10;
            align-items: center;
        }
        .btn {
            width: 40px; height: 40px; border-radius: 50%; border: 3px solid white;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn:hover { transform: scale(1.3); }

        .btn-refresh {
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #ff7675;
            border: none;
            font-weight: bold;
        }
        
        .divider {
            width: 2px;
            height: 30px;
            background: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

    <div id="ui">RARE ITEM</div>
    
    <div id="controls">
        <div class="btn" style="background: #ff4d4d;" onclick="changeRoseColor('#ff4d4d')"></div>
        <div class="btn" style="background: #74b9ff;" onclick="changeRoseColor('#74b9ff')"></div>
        <div class="btn" style="background: #f8a5c2;" onclick="changeRoseColor('#f8a5c2')"></div>
        <div class="btn" style="background: #f9ca24;" onclick="changeRoseColor('#f9ca24')"></div>
        <div class="divider"></div>
        <div class="btn btn-refresh" onclick="regenerateFlower()" title="Regenerar flor">↻</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        
        // Ajuste de Cámara: FOV de 60 para menos distorsión, y posición Z=20 para alejarla
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 22); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        // El target en (0, 4, 0) centra la cámara en la mitad de la flor, no en el suelo
        controls.target.set(0, 4, 0); 

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const pointLight = new THREE.PointLight(0xffffff, 15);
        pointLight.position.set(10, 15, 10);
        scene.add(pointLight);

        const flowerGroup = new THREE.Group();
        scene.add(flowerGroup);

        let blocks = [];
        let currentColor = 0xff4d4d;
        const geometry = new THREE.BoxGeometry(0.9, 0.9, 0.9);

        const voxels = [
            [0,0,0, true], [0,1,0, true], [0,2,0, true], [1,2,0, true], 
            [0,3,0, true], [0,4,0, true], [-1,4,0, true], [0,5,0, true],
            [0,6,0, false], [1,6,0, false], [-1,6,0, false], [0,6,1, false], [0,6,-1,false],
            [1,7,0, false], [-1,7,0, false], [0,7,1, false], [0,7,-1,false],
            [1,7,1, false], [-1,7,-1,false], [1,7,-1,false], [-1,7,1, false],
            [0,8,0, false]
        ];

        async function build() {
            // Limpieza total antes de reconstruir
            while(flowerGroup.children.length > 0){ 
                const obj = flowerGroup.children[0];
                obj.geometry.dispose();
                obj.material.dispose();
                flowerGroup.remove(obj); 
            }
            blocks = [];

            for (let i = 0; i < voxels.length; i++) {
                const [x, y, z, isStem] = voxels[i];
                const color = isStem ? 0x2ecc71 : currentColor;
                
                const mat = new THREE.MeshStandardMaterial({ 
                    color: color,
                    emissive: isStem ? 0x000000 : color,
                    emissiveIntensity: 0,
                    roughness: 0.3
                });

                const cube = new THREE.Mesh(geometry, mat);
                cube.position.set(x, y, z);
                cube.scale.set(0, 0, 0);
                
                flowerGroup.add(cube);
                blocks.push({
                    mesh: cube,
                    isStem: isStem,
                    offset: Math.random() * 10
                });

                setTimeout(() => {
                    let s = 0;
                    const interval = setInterval(() => {
                        s += 0.08; 
                        cube.scale.set(s, s, s);
                        if (s >= 1) {
                            cube.scale.set(1, 1, 1);
                            clearInterval(interval);
                        }
                    }, 20);
                }, i * 45);
            }
        }

        build();

        // Expuesto a window para los botones HTML
        window.changeRoseColor = (hex) => {
            currentColor = hex;
            blocks.forEach(b => {
                if (!b.isStem) {
                    b.mesh.material.color.set(hex);
                    b.mesh.material.emissive.set(hex);
                }
            });
        };

        window.regenerateFlower = () => {
            build();
        };

        function animate(time) {
            requestAnimationFrame(animate);
            const t = time * 0.001;

            flowerGroup.rotation.y += 0.005;
            // Flotación sutil
            flowerGroup.position.y = Math.sin(t) * 0.3;

            // Pulso de brillo en los pétalos
            blocks.forEach(b => {
                if (!b.isStem) {
                    const pulse = (Math.sin(t * 3 + b.offset) + 1) / 2;
                    b.mesh.material.emissiveIntensity = pulse * 1.5;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
