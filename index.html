<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rare Item for You</title>
    <style>
        body { 
            margin: 0; 
            /* Fondo cálido tipo atardecer */
            background: linear-gradient(180deg, #ffafbd 0%, #ffc3a0 100%); 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace; 
        }
        #ui {
            position: absolute;
            top: 40px; width: 100%; text-align: center;
            color: #ffffff; text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            font-size: 3rem; pointer-events: none; font-weight: bold;
            letter-spacing: 4px;
        }
        #controls {
            position: absolute;
            bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; background: rgba(255,255,255,0.3);
            padding: 12px 25px; border-radius: 50px; backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn {
            width: 35px; height: 35px; border-radius: 50%; border: 3px solid white;
            cursor: pointer; transition: all 0.3s ease;
        }
        .btn:hover { transform: scale(1.3); box-shadow: 0 0 15px rgba(255,255,255,0.8); }
    </style>
</head>
<body>

    <div id="ui">RARE ITEM</div>
    
    <div id="controls">
        <div class="btn" style="background: #ff4d4d;" onclick="changeColor(0xff4d4d)"></div>
        <div class="btn" style="background: #74b9ff;" onclick="changeColor(0x74b9ff)"></div>
        <div class="btn" style="background: #a29bfe;" onclick="changeColor(0xa29bfe)"></div>
        <div class="btn" style="background: #fab1a0;" onclick="changeColor(0fab1a0)"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Luces ambientales cálidas
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);
        
        const topLight = new THREE.PointLight(0xffffff, 200);
        topLight.position.set(0, 15, 5);
        scene.add(topLight);

        const flowerGroup = new THREE.Group();
        scene.add(flowerGroup);

        // Datos de la rosa (Matriz 3D mejorada)
        const voxels = [
            // Tallo
            {x:0, y:0, z:0, isStem:true}, {x:0, y:1, z:0, isStem:true}, {x:0, y:2, z:0, isStem:true}, 
            {x:1, y:2, z:0, isStem:true}, {x:0, y:3, z:0, isStem:true}, {x:0, y:4, z:0, isStem:true}, 
            {x:-1, y:4, z:0, isStem:true}, {x:0, y:5, z:0, isStem:true},
            // Pétalos (Capa base)
            {x:0, y:6, z:0, isStem:false}, {x:1, y:6, z:0, isStem:false}, {x:-1, y:6, z:0, isStem:false}, 
            {x:0, y:6, z:1, isStem:false}, {x:0, y:6, z:-1, isStem:false},
            // Pétalos (Capa media)
            {x:1, y:7, z:1, isStem:false}, {x:-1, y:7, z:-1, isStem:false}, {x:1, y:7, z:-1, isStem:false}, 
            {x:-1, y:7, z:1, isStem:false}, {x:0, y:8, z:0, isStem:false},
            // Grosor extra para que sea más 3D
            {x:1, y:7, z:0, isStem:false}, {x:-1, y:7, z:0, isStem:false}, {x:0, y:7, z:1, isStem:false}, {x:0, y:7, z:-1, isStem:false}
        ];

        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const blocks = [];

        async function createRose() {
            for (let i = 0; i < voxels.length; i++) {
                const v = voxels[i];
                const color = v.isStem ? 0x44bd32 : 0xff4d4d;
                
                const material = new THREE.MeshStandardMaterial({ 
                    color: color,
                    emissive: v.isStem ? 0x000000 : color,
                    emissiveIntensity: 0,
                    roughness: 0.2
                });

                const cube = new THREE.Mesh(geometry, material);
                cube.position.set(v.x, v.y, v.z);
                cube.scale.set(0,0,0);
                
                // Guardamos un "offset" único para el brillo independiente
                blocks.push({
                    mesh: cube,
                    isStem: v.isStem,
                    offset: Math.random() * Math.PI * 2 
                });

                flowerGroup.add(cube);

                // Aparecer con delay
                setTimeout(() => {
                    let s = 0;
                    const grow = setInterval(() => {
                        s += 0.1;
                        cube.scale.set(s,s,s);
                        if(s >= 1) clearInterval(grow);
                    }, 20);
                }, i * 80);
            }
        }

        createRose();

        window.changeColor = (newHex) => {
            blocks.forEach(b => {
                if(!b.isStem) {
                    b.mesh.material.color.setHex(newHex);
                    b.mesh.material.emissive.setHex(newHex);
                }
            });
        };

        function animate(time) {
            requestAnimationFrame(animate);
            const t = time * 0.002;

            // Rotación suave
            flowerGroup.rotation.y += 0.008;
            flowerGroup.position.y = Math.sin(t) * 0.3;

            // Brillo INDEPENDIENTE para cada bloque
            blocks.forEach(b => {
                if(!b.isStem) {
                    // Cada bloque usa su propio offset para que el brillo no sea simultáneo
                    const pulse = (Math.sin(t * 2 + b.offset) + 1) / 2; 
                    b.mesh.material.emissiveIntensity = pulse * 1.5; 
                    // Pequeño movimiento individual
                    b.mesh.position.y += Math.sin(t * 3 + b.offset) * 0.002;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
