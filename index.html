<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rare Item - Minecraft Rose</title>
    <style>
        body { margin: 0; background: radial-gradient(circle, #2c3e50, #000000); overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #ui {
            position: absolute;
            top: 40px; width: 100%; text-align: center;
            color: #ffcc00; text-shadow: 0 0 10px #ffaa00;
            font-size: 3rem; pointer-events: none; font-weight: bold;
        }
        #controls {
            position: absolute;
            bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; background: rgba(255,255,255,0.1);
            padding: 15px; border-radius: 50px; backdrop-filter: blur(5px);
        }
        .btn {
            width: 30px; height: 30px; border-radius: 50%; border: 2px solid white;
            cursor: pointer; transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.2); }
    </style>
</head>
<body>

    <div id="ui">RARE ITEM</div>
    
    <div id="controls">
        <div class="btn" style="background: #ff2222;" onclick="changeColor(0xff2222)"></div>
        <div class="btn" style="background: #22aaff;" onclick="changeColor(0x22aaff)"></div>
        <div class="btn" style="background: #ff69b4;" onclick="changeColor(0xff69b4)"></div>
        <div class="btn" style="background: #ffcc00;" onclick="changeColor(0xffcc00)"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Escena y Cámara
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Luces
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 150);
        pointLight.position.set(0, 10, 0);
        scene.add(pointLight);

        // Suelo Decorativo (Espejo oscuro)
        const ground = new THREE.Mesh(
            new THREE.CircleGeometry(10, 32),
            new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.8 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1;
        scene.add(ground);

        // Estructura 3D de la Rosa
        const flowerGroup = new THREE.Group();
        scene.add(flowerGroup);

        const voxels = [
            // Tallo (x, y, z, esTallo)
            [0,0,0,true], [0,1,0,true], [0,2,0,true], [1,2,0,true], [0,3,0,true], [0,4,0,true], [-1,4,0,true], [0,5,0,true],
            // Capas de pétalos (X, Y, Z)
            [0,6,0,false], [1,6,0,false], [-1,6,0,false], [0,6,1,false], [0,6,-1,false],
            [1,7,0,false], [-1,7,0,false], [0,7,1,false], [0,7,-1,false], [0,8,0,false],
            [1,6,1,false], [-1,6,-1,false], [1,6,-1,false], [-1,6,1,false]
        ];

        const geometry = new THREE.BoxGeometry(0.95, 0.95, 0.95);
        const petalMeshes = [];

        async function init() {
            for (const [x, y, z, isStem] of voxels) {
                const color = isStem ? 0x2e7d32 : 0xff2222;
                // Usamos MeshPhysicalMaterial para que el brillo se vea mejor
                const material = new THREE.MeshPhysicalMaterial({ 
                    color: color,
                    emissive: isStem ? 0x000000 : color,
                    emissiveIntensity: 0.5,
                    roughness: 0.3
                });

                const cube = new THREE.Mesh(geometry, material);
                cube.position.set(x, y, z);
                cube.scale.set(0,0,0);
                flowerGroup.add(cube);
                
                if (!isStem) petalMeshes.push(cube);

                // Animación de escala inicial
                setTimeout(() => {
                    const grow = setInterval(() => {
                        cube.scale.x += 0.1;
                        cube.scale.y += 0.1;
                        cube.scale.z += 0.1;
                        if(cube.scale.x >= 1) clearInterval(grow);
                    }, 30);
                }, y * 100);
            }
        }

        init();

        // Función global para cambiar color
        window.changeColor = (colorHex) => {
            petalMeshes.forEach(mesh => {
                mesh.material.color.setHex(colorHex);
                mesh.material.emissive.setHex(colorHex);
            });
        };

        function animate(time) {
            requestAnimationFrame(animate);
            
            // Animación de rotación y levitación
            flowerGroup.rotation.y += 0.01;
            flowerGroup.position.y = Math.sin(time * 0.002) * 0.5 + 0.5;

            // Efecto de pulso en el brillo (emisión)
            petalMeshes.forEach(mesh => {
                mesh.material.emissiveIntensity = 0.5 + Math.sin(time * 0.005) * 0.3;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
